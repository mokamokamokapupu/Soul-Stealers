<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Studies — Room</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Source+Serif+4:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="atmosphere" aria-hidden="true"></div>
<div class="chat-shell">
  <div class="chat-topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="sigil" aria-hidden="true">
        <path d="M12 2c1.2 2.6 3.6 4.8 3.6 8.2 0 3-1.8 5.3-3.6 6.5-1.8-1.2-3.6-3.5-3.6-6.5C8.4 6.8 10.8 4.6 12 2z"/>
        <circle cx="12" cy="19.5" r="1.6"/>
      </svg>
      <h1>The Room</h1>
    </div>
    <div class="chat-identity">
      <label class="avatar-picker" title="Change your profile picture">
        <img class="avatar" id="my-avatar" alt="Your profile picture">
        <span class="avatar-hint" aria-hidden="true">+</span>
        <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp">
      </label>
      <span class="who">you are <strong id="who-name">—</strong></span>
      &nbsp;·&nbsp;
      <button class="logout-link" id="logout-btn">leave</button>
    </div>
  </div>

  <p class="avatar-status" id="avatar-status"></p>

  <div class="messages" id="messages">
    <p class="empty-state">It's quiet. Say something.</p>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="msg-input" maxlength="500" placeholder="Write something…" required>
    <button type="submit">Send</button>
  </form>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/chat.js"></script>
</body>
</html>
