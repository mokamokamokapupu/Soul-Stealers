<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Studies — Choose a name</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Source+Serif+4:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="atmosphere" aria-hidden="true"></div>
<div class="shell">
  <div class="card" id="card">
    <svg viewBox="0 0 24 24" class="sigil" aria-hidden="true">
      <path d="M12 2c1.2 2.6 3.6 4.8 3.6 8.2 0 3-1.8 5.3-3.6 6.5-1.8-1.2-3.6-3.5-3.6-6.5C8.4 6.8 10.8 4.6 12 2z"/>
      <circle cx="12" cy="19.5" r="1.6"/>
    </svg>
    <p class="eyebrow">Soul Studies</p>
    <h1>Choose how you'll be known here.</h1>
    <p class="lede">Not your name. Just a name.</p>

    <form id="setup-form" autocomplete="off">
      <div class="field">
        <label for="username">Name</label>
        <input type="text" id="username" name="username" maxlength="20" required autofocus>
      </div>
      <p class="error-msg" id="error" role="alert"></p>
      <button type="submit" id="submit-btn">Continue</button>
    </form>
  </div>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/setup.js"></script>
</body>
</html>
